<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Abrir en el teléfono — Alex Solutions</title>
  <meta name="description" content="Códigos QR para abrir Alex Solutions en tu teléfono." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Alex Solutions, Inc" />
  <meta property="og:title" content="Abrir en el teléfono — Alex Solutions" />
  <meta property="og:description" content="Códigos QR para abrir Alex Solutions en tu teléfono." />
  <meta property="og:url" content="https://licenciapro-chicago.onrender.com/qr" />
  <meta property="og:image" content="https://images.unsplash.com/photo-1514933651103-005eec06c04b?auto=format&fit=crop&w=1200&h=630&q=70" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="theme-color" content="#7a1f2b" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    body { background: radial-gradient(1200px 600px at 50% -10%, #5a1220 0%, #2a0711 50%, #0b0205 100%); color: #fff; min-height: 100vh; }
    .wrap { width: min(1100px, 100% - 32px); margin: 0 auto; padding: 36px 0 60px; text-align: center; }
    h1 { font-size: clamp(28px, 4vw, 44px); margin-bottom: 6px; }
    .sub { color: rgba(255,255,255,.8); margin: 0 0 30px; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
    @media (max-width: 960px) { .grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 520px) { .grid { grid-template-columns: 1fr; } }
    .q { background: #fff; color: #1d1a16; border-radius: 22px; padding: 20px; }
    .q.main { outline: 4px solid #f2cf85; }
    .q h2 { font: 700 18px var(--font); margin: 0 0 2px; }
    .q p { margin: 0 0 10px; color: #6b6359; font-size: 13px; }
    .q img { width: 100%; max-width: 220px; height: auto; image-rendering: pixelated; margin: 0 auto; }
    .q a { display: block; margin-top: 8px; font-size: 12px; color: #7a1f2b; word-break: break-all; }
  </style>
</head>
<body>
  <div class="wrap">
    <a href="/" class="logo" style="color:#fff;justify-content:center;margin-bottom:18px"><span class="logo-mark">🍷</span> Alex Solutions, Inc</a>
    <h1>Escanea con la cámara de tu teléfono</h1>
    <p class="sub">Apunta la cámara al código y toca el enlace que aparece.</p>
    <div class="grid" id="grid"></div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <script src="/js/qr.js"></script>
  <script src="/i18n.js"></script>
</body>
</html>
