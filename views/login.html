<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Entrar — Alex Solutions, Inc</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="auth">
    <div class="auth-art">
      <a href="/" class="logo" style="color:#fff"><span class="logo-mark">🍷</span> Alex Solutions, Inc</a>
      <blockquote>“Cada restaurante sin licencia de licor es una conversación esperando a suceder.”<br /><span style="font:500 15px var(--font);opacity:.8">— Alex Zavala</span></blockquote>
      <span style="opacity:.7;font-size:13px">Datos oficiales de la Ciudad de Chicago · actualizados a diario</span>
    </div>
    <div class="auth-form">
      <form method="post" action="/login" autocomplete="on">
        <a href="/" class="logo" style="margin-bottom:28px"><span class="logo-mark">🍷</span> Alex Solutions, Inc</a>
        <h1 style="font-size:32px">Bienvenido, Alex</h1>
        <p style="color:var(--muted);margin:0 0 24px">Entra para ver tus prospectos.</p>
        <div id="err"></div>
        <div class="field"><label for="user">Usuario</label><input id="user" name="user" required autocomplete="username" /></div>
        <div class="field"><label for="password">Contraseña</label><input id="password" name="password" type="password" required autocomplete="current-password" /></div>
        <button class="btn btn-primary" style="width:100%;justify-content:center" type="submit">Entrar</button>
        <p style="color:var(--muted);font-size:13px;margin-top:20px"><a href="/">← Volver al inicio</a></p>
      </form>
    </div>
  </main>
  <script>
    const e = new URLSearchParams(location.search).get("e");
    if (e) document.getElementById("err").innerHTML = '<div class="alert">' + (e === "limit" ? "Demasiados intentos. Espera 15 minutos." : "Usuario o contraseña incorrectos.") + "</div>";
  </script>
  <script src="/i18n.js"></script>
</body>
</html>
